<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Happy Anniversary ♡</title>

    </head>

    <body>
        <main>

            <!-- State 1: Opening-->
             <section id ="start">

                <h1>Happy Anniversary!</h1>
                <p> Do you love me?</p>

                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>

             </section>
            
             <!-- State 2: Wrong Answer-->
              <section id="wrongAnswer">

                <h1> Wrong answer.</h1>
                
                <img src="assets/images/angry-cat.jpg" alt="angry cat">

                <button id="tryAgainBtn">Try again.</button>

              </section>

            <!-- State 3: Anniversary Card-->
             <section id="anniversaryCard">

                <h1>Happy 3 Year Anniversary</h1>

                <p>
                    Message text goes here
                </p>

                <button id="cardBtn">Click here!</button>

             </section>

            <!-- State 4: Relationship Counter-->
             <section id="countdown">

                <h1>We've been together for...</h1>

                <!-- Countdown Timer-->
                <div id="counterTime">
                    <span id="daysNumber">0000</span>:
                    <span id="hoursNumber">00</span>:
                    <span id="minutesNumber">00</span>:
                    <span id="secondsNumber">00</span>
                </div>

                <!-- Countdown Labels-->
                 <div id="counterLabels">
                    <span>days</span>
                    <span>hours</span>
                    <span>minutes</span>
                    <span>seconds</span>
                 </div>

                <button id="backBtn">Back to card</button>
             </section>

        </main>

        <script src="js/script.js"> </script>
        
    </body>
</html>
