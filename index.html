<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Happy Anniversary ♡</title>

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/wrongAnswer.css">
        <link rel="stylesheet" href="css/card.css">
        <link rel="stylesheet" href="css/counter.css">
        <link rel="stylesheet" href="css/start.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=DM+Serif+Display:ital@0;1&family=Playfair+Display&display=swap" rel="stylesheet">
    </head>

    <body>
        <main>

            <!-- State 1: Opening-->
             <section id ="start">

                <h1>Happy Anniversary!</h1>
             </br>
                <p> Do you love me?</p>

                <div class="startButtons">
                    <button id="yesBtn">Yes ♡</button>
                    <button id="noBtn">No</button>
                </div>
               

             </section>
            
             <!-- State 2: Wrong Answer-->
              <section id="wrongAnswer">

                <h1> Wrong answer.</h1>
                
                <img src="assets/images/angry-cat.jpg" alt="angry cat">

                <button id="tryAgainBtn">Try again.</button>

              </section>

            <!-- State 3: Anniversary Card-->
             <section id="anniversaryCard">

                <h1>Happy 3 Year Anniversary</h1>

                <p>
                    Message text goes here
                </p>

                <button id="cardBtn">Click here!</button>

             </section>

            <!-- State 4: Relationship Counter-->
             <section id="relationshipCounter">

                <h1>We've been together for...</h1>

                <!-- Countdown Timer-->
                <div id="counterTime">
                    <span id="daysNumber">0000</span>:
                    <span id="hoursNumber">00</span>:
                    <span id="minutesNumber">00</span>:
                    <span id="secondsNumber">00</span>
                </div>

                <!-- Countdown Labels-->
                 <div id="counterLabels">
                    <span>days</span>
                    <span>hours</span>
                    <span>minutes</span>
                    <span>seconds</span>
                 </div>

                <button id="backBtn">Back to card</button>
             </section>

        </main>

        <script src="js/script.js"> </script>

    </body>
</html>
